name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *" # runs every 12 hours

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#b91c1c&color_dots=#fecaca,#fca5a5,#f87171,#ef4444,#dc2626&color_empty=#ebedf0
            dist/snake-dark.svg?color_snake=#ef4444&color_dots=#450a0a,#7f1d1d,#b91c1c,#dc2626,#ef4444&color_empty=#161b22

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
